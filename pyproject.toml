[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brvm-ai"
version = "0.1.0"
description = "Socle Python sécurisé et testable pour l’analyse quantitative BRVM/UEMOA."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "BRVM-AI contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2.3.250308",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]
statistics = ["polars>=1.0,<2", "scipy>=1.13,<2", "statsmodels>=0.14,<1"]
machine-learning = ["scikit-learn>=1.5,<2"]
boosting = ["lightgbm>=4,<5", "xgboost>=2,<4"]
database = ["alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "sqlalchemy>=2,<3"]
api = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
pretty = true
