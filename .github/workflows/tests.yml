name: Tests et qualité Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Installer le paquet et les outils de développement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database,telegram]"

      - name: Vérifier le lint
        run: ruff check .

      - name: Vérifier le format
        run: ruff format --check .

      - name: Vérifier les types
        run: mypy src

      - name: Exécuter les tests avec couverture
        run: pytest --cov=brvm_ia --cov-report=term-missing
